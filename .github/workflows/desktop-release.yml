name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Write frontend Supabase env
        working-directory: frontend
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Strip CR/BOM/quotes/whitespace (common when pasting into GitHub secrets).
          URL="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '\r' | sed -e 's/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          KEY="$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | tr -d '\r' | sed -e 's/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in repo Actions secrets."
            exit 1
          fi

          # If someone pasted host-only (e.g. xxx.supabase.co), prepend https://
          if ! printf '%s' "$URL" | grep -qiE '^https?://'; then
            if printf '%s' "$URL" | grep -qiE '^[A-Za-z0-9.-]+\.[A-Za-z]{2,}(/.*)?$'; then
              echo "VITE_SUPABASE_URL missing scheme; prepending https://"
              URL="https://${URL}"
            fi
          fi

          if ! printf '%s' "$URL" | grep -qiE '^https?://'; then
            echo "::error::VITE_SUPABASE_URL must be a full http(s) URL like https://xxxx.supabase.co (got length ${#URL}, no http/https prefix)."
            exit 1
          fi

          # Vite reads .env during `pnpm build` / tauri beforeBuildCommand.
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$KEY"
          } > .env
          echo "Wrote frontend/.env (url_len=${#URL} key_len=${#KEY})."

      - name: Set release version
        id: ver
        working-directory: frontend
        shell: bash
        # Fresh repo run #1 => 1.0.10 so installs on 1.0.9 still update.
        run: |
          VERSION="1.0.$((9 + ${{ github.run_number }}))"
          node scripts/set-release-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: frontend
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: MinistryCast ${{ steps.ver.outputs.version }}
          releaseBody: Production desktop build from main.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
